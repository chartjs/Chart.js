env:
  jasmine: true

globals:
  acquireChart: true
  afterEvent: true
  Chart: true
  moment: true
  waitForResize: true

rules:
  max-statements: ["warn", 50]

overrides:
  # Specs that run under Vitest (vitest.config.js, `globals: true`) and its
  # setup, and the smoke suite of the built bundle (vitest.umd.config.js).
  - files: ['specs/**/*.spec.js', 'setup.js', 'vitest.shared.js', 'umd/**/*.spec.js', 'setup.umd.js']
    env:
      jasmine: false
    globals:
      afterAll: readonly
      afterEach: readonly
      beforeAll: readonly
      beforeEach: readonly
      createMockContext: readonly
      describe: readonly
      expect: readonly
      it: readonly
      releaseChart: readonly
      test: readonly
      triggerMouseEvent: readonly
      vi: readonly
  # Image fixtures, evaluated by test/specs/fixtures.spec.js with the globals of
  # test/setup.js.
  - files: ['fixtures/**/*.js']
    globals:
      triggerMouseEvent: readonly
