# This workflow publishes new documentation to https://chartjs.org/docs/master after every commit
name: Deploy docs

on:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  correct_repository:
    permissions:
      contents: none
    runs-on: ubuntu-latest
    steps:
      - name: fail on fork
        if: github.repository_owner != 'chartjs'
        run: exit 1

  build:
    needs: correct_repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.1.0
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Generate docs deploy token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.DOCS_DEPLOY_CLIENT_ID }}
          private-key: ${{ secrets.DOCS_DEPLOY_PRIVATE_KEY }}
          owner: chartjs
          repositories: chartjs.github.io
          permission-contents: write
      - name: Package & Deploy Docs
        run: |
          pnpm install
          pnpm run build
          ./scripts/docs-config.sh "master"
          pnpm run docs
          pnpm pack
          ./scripts/deploy-docs.sh "master"
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
