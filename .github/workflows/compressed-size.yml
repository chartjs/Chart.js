name: Compressed Size

on: [pull_request]

permissions:
  contents: read

jobs:
  build:

    permissions:
      contents: read  # for actions/checkout to fetch code
      pull-requests: read  # for preactjs/compressed-size-action to read the pull request
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        registry-url: https://registry.npmjs.org/
        node-version: 26
        cache: pnpm
    # The action installs and builds both the pull request and its base itself.
    - id: size
      uses: preactjs/compressed-size-action@f322c295dde06a1cb7ccaef105732dd8a726d1d9 # 2.10.0
      with:
        repo-token: "${{ secrets.GITHUB_TOKEN }}"
    # Pull requests from forks get a read-only token, so this job cannot
    # comment. It hands the report to compressed-size-comment.yml instead.
    - name: Save the report
      env:
        COMMENT_BODY: ${{ steps.size.outputs.comment-body }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        mkdir size-report
        printf '%s\n' "$COMMENT_BODY" > size-report/comment.md
        printf '%s\n' "$PR_NUMBER" > size-report/pr-number
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: size-report
        path: size-report/
        retention-days: 1
