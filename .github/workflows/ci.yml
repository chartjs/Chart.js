name: CI

on:
  push:
    branches:
      - master
      - "2.9"
  pull_request:
    branches:
      - master
      - "2.9"
  workflow_dispatch:
permissions:
  contents: read

jobs:
  build:
    permissions:
      checks: write  # for coverallsapp/github-action to create new checks
      contents: read  # for dorny/paths-filter to fetch a list of changed files
      pull-requests: read  # for dorny/paths-filter to read pull requests
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
      fail-fast: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        with:
          filters: |
            docs:
              - 'docs/**'
              - 'package.json'
              - 'tsconfig.json'
            src:
              - 'src/**'
              - 'package.json'
            test:
              - 'test/**'
              - 'karma.conf.cjs'
              - 'vitest*.config.js'
              - 'package.json'
              - 'pnpm-lock.yaml'
            types:
              - 'package.json'
              - 'tsconfig.json'
      - name: Install
        run: pnpm install
      - name: Lint
        run: pnpm run lint
      - name: Build
        run: pnpm run build
      - name: Install Playwright browsers
        if: |
          (steps.changes.outputs.src == 'true' ||
          steps.changes.outputs.test == 'true') &&
          runner.os != 'Windows'
        run: pnpm exec playwright install --with-deps chromium firefox
      - name: Test
        if: |
          (steps.changes.outputs.src == 'true' ||
          steps.changes.outputs.test == 'true') &&
          runner.os != 'Windows'
        run: |
          pnpm run build
          if [ "${{ runner.os }}" == "macOS" ]; then
            pnpm run test-ci --browsers chrome,safari
          else
            xvfb-run --auto-servernum pnpm run test-ci
          fi
        shell: bash
      - name: Package
        if: steps.changes.outputs.docs == 'true'
        run: |
          pnpm run docs
          pnpm pack
      # The VitePress site that will replace VuePress: checked until it does,
      # so that a docs change cannot break it unnoticed.
      - name: Type-check docs
        if: steps.changes.outputs.docs == 'true'
        run: pnpm run docs:typecheck
      - name: Test docs site code
        if: steps.changes.outputs.docs == 'true'
        run: pnpm --filter chartjs-docs-vitepress test
      - name: Build VitePress docs
        if: steps.changes.outputs.docs == 'true'
        run: pnpm run docs:vitepress
      # One report of every test runner's coverage, so that Coveralls posts
      # the combined total only; a spec moving between runners leaves it as is.
      - name: Coveralls
        if: |
          steps.changes.outputs.src == 'true' &&
          runner.os != 'Windows'
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          github-token: ${{ secrets.github_token }}
          files: ./coverage/chrome/lcov.info ./coverage/firefox/lcov.info ./coverage/vitest/lcov.info
          coverage-reporter-version: v0.6.22
