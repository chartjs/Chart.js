name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  setup:
    permissions:
      contents: none
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.trim.outputs.version }}
    steps:
      - id: trim
        run: echo "version=${TAG:1}" >> $GITHUB_OUTPUT
        env:
          TAG: ${{ github.event.release.tag_name }}

  release:
    permissions:
      contents: write  # for gh release upload to attach the tarball
      id-token: write  # for npm trusted publishing (OIDC)
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          registry-url: https://registry.npmjs.org/
          node-version: 26
          # No pnpm cache here: other workflow runs write it, and this job publishes.
      # This job holds the npm publishing identity, so it installs only the
      # root package's dependencies. The docs toolchain runs in release-docs.
      - name: Setup and build
        run: |
          pnpm install --filter chart.js
          npm pkg set version="$VERSION"
          pnpm run build
          pnpm pack
        env:
          VERSION: ${{ needs.setup.outputs.version }}
          # Without this, `pnpm run` reinstalls the whole workspace first.
          pnpm_config_verify_deps_before_run: false
      - name: Publish to NPM
        run: ./scripts/publish.sh
        env:
          VERSION: ${{ needs.setup.outputs.version }}
      - name: Upload NPM package file
        run: gh release upload "$TAG" "chart.js-$VERSION.tgz"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
          VERSION: ${{ needs.setup.outputs.version }}

  release-docs:
    needs: [setup, release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - name: Setup and build
        run: |
          pnpm install
          npm pkg set version="$VERSION"
          pnpm run build
          ./scripts/docs-config.sh "$VERSION" release
          pnpm run docs
        env:
          VERSION: ${{ needs.setup.outputs.version }}
      - name: Generate docs deploy token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.DOCS_DEPLOY_CLIENT_ID }}
          private-key: ${{ secrets.DOCS_DEPLOY_PRIVATE_KEY }}
          owner: chartjs
          repositories: chartjs.github.io
          permission-contents: write
      - name: Deploy Docs
        run: ./scripts/deploy-docs.sh "$VERSION" release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          VERSION: ${{ needs.setup.outputs.version }}

  release-tag:
    # Runs after release-docs: both push to chartjs.github.io.
    needs: [setup, release, release-docs]
    runs-on: ubuntu-latest
    if: "!github.event.release.prerelease"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          registry-url: https://registry.npmjs.org/
          node-version: 26
          cache: pnpm
      - name: Setup and build
        run: |
          pnpm install
          npm pkg set version="$VERSION"
          pnpm run build
          ./scripts/docs-config.sh "$VERSION"
          pnpm run docs
        env:
          VERSION: ${{ needs.setup.outputs.version }}
      - name: Generate docs deploy token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.DOCS_DEPLOY_CLIENT_ID }}
          private-key: ${{ secrets.DOCS_DEPLOY_PRIVATE_KEY }}
          owner: chartjs
          repositories: chartjs.github.io
          permission-contents: write
      - name: Deploy Docs
        run: ./scripts/deploy-docs.sh "$VERSION"
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          VERSION: ${{ needs.setup.outputs.version }}
